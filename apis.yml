    type: Documentation
  - url: openapi/gradient-labs-openapi.yml
    type: OpenAPI
  description: Signed, ordered webhook events the AI agent delivers to your endpoint -
    agent.message, conversation.hand_off, conversation.finished, action.execute,
    and resource.pull - each carrying an incrementing sequence_number so you can
    establish a total order of events per conversation.
