name: Gradient Labs
kind: company
description: Gradient Labs builds "Otto", an AI customer support agent that autonomously
  handles complex, end-to-end support conversations for regulated and financial services
  businesses. The API lets you start and drive conversations, stream customer messages,
  hand off to human agents, execute business actions/tools, and manage the knowledge
  base the agent reasons over, with signed webhooks delivering the agent's outbound
  messages and events.
