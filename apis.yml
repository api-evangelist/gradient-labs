    type: Documentation
  - url: openapi/gradient-labs-openapi.yml
    type: OpenAPI
  - url: collections/gradient-labs.postman_collection.json
    type: PostmanCollection
  - url: collections/gradient-labs.opencollection.json
    type: OpenCollection
  description: Start a conversation, assign it to the Gradient Labs AI agent, read
    its current state, and manage its lifecycle (finish, cancel, resume). The AI
    agent autonomously works the conversation and emits outbound messages and events
    via webhooks.
